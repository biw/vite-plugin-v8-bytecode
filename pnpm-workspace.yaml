packages:
  - "examples/*"

allowBuilds:
  electron: true
  # Pulled in transitively by electron-builder. Its postinstall only prepares
  # Squirrel installer tooling, which the packaging tests never invoke, so the
  # build stays off and pnpm does not stop to ask.
  electron-winstaller: false
  esbuild: true

overrides:
  rollup: "4.52.5"
  vite: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
