name: Electron compatibility

# Split from CI because the two answer different questions. A failure here on a
# pull request means the change broke a supported Electron; a failure on the
# schedule means a newly released Electron broke us, with no change involved.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  # Electron ships patches weekly and a major roughly every eight weeks. Without
  # a timer, a break in a new release stays invisible until someone opens a pull
  # request.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  versions:
    name: Resolve Electron versions
    runs-on: ubuntu-latest
    # Draft pull requests get the cheaper CI workflow only.
    if: github.event.pull_request.draft != true
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Resolve matrix
        id: resolve
        env:
          # The schedule is not blocking anything, so it sweeps the whole
          # supported span. Pull requests take the bounded set to keep feedback
          # fast while still covering both ends of the range.
          SWEEP: ${{ github.event_name == 'schedule' && 'full' || 'bounded' }}
        run: |
          node --input-type=module -e '
            // Electron 35 is the first major to ship Node 22, the floor this
            // package declares in engines. Deliberately older than Electron own
            // support window: the plugin compiles bytecode with whatever binary
            // will run it, so support here does not lapse when upstream stops
            // patching a release.
            const FLOOR = 35;
            const FALLBACK = [{ version: String(FLOOR), experimental: false }];

            let entries;
            try {
              const response = await fetch(
                "https://releases.electronjs.org/releases.json",
                { signal: AbortSignal.timeout(30_000) }
              );
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }
              const releases = await response.json();
              const isPreview = (version) => /-(alpha|beta)/.test(version);
              const isPrerelease = (version) =>
                isPreview(version) || version.includes("-nightly");

              const majors = [
                ...new Set(
                  releases
                    .filter((release) => !isPrerelease(release.version))
                    .map((release) => Number(release.version.split(".")[0]))
                ),
              ]
                .filter((major) => major >= FLOOR)
                .sort((left, right) => right - left);

              const selected =
                process.env.SWEEP === "full"
                  ? majors
                  : [...new Set([...majors.slice(0, 3), FLOOR])];

              entries = selected
                .sort((left, right) => right - left)
                .map((major) => ({
                  version: String(major),
                  experimental: false,
                }));

              // A break in an Electron preview is information about Electron,
              // not a defect here, so it reports without blocking a merge.
              const preview = releases.find((release) =>
                isPreview(release.version)
              );
              if (preview) {
                entries.push({ version: preview.version, experimental: true });
              }
            } catch (error) {
              console.error("Falling back to a pinned list:", error.message);
              entries = FALLBACK;
            }

            console.log(JSON.stringify(entries, null, 2));
            await import("node:fs").then(({ appendFileSync }) =>
              appendFileSync(
                process.env.GITHUB_OUTPUT,
                "matrix=" + JSON.stringify(entries) + "\n"
              )
            );
          '

  runtime:
    name: Electron ${{ matrix.version }}
    needs: versions
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.versions.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-electron
        with:
          electron-version: ${{ matrix.version }}

      # Globbed through the package script so a newly added Electron test
      # cannot silently skip this matrix.
      - name: Test Electron runtime
        shell: bash
        run: $ELECTRON_LAUNCH_PREFIX pnpm test:electron

  # Runs everywhere because packaging is the one dimension where the host
  # genuinely changes the output: bundle layout differs per platform, and the
  # require specifiers the plugin emits are computed from real paths, which
  # only Windows exercises for real.
  packaged:
    name: Packaged app (${{ matrix.os }})
    # No dependency on the version resolver: packaging pins to the lockfile's
    # Electron, so this starts immediately instead of queueing behind it.
    if: github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-electron

      # Installed here rather than as a devDependency: it adds ~88 MB that
      # every other job would carry for nothing.
      - name: Install packager
        shell: bash
        run: pnpm add --save-dev electron-builder

      - name: Test packaged app
        shell: bash
        # Turns a missing packager into a failure instead of a silent skip.
        env:
          REQUIRE_PACKAGED_TESTS: "1"
        run: $ELECTRON_LAUNCH_PREFIX pnpm test:packaged
