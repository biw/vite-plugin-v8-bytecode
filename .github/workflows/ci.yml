name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Lint, type check, and build are identical on every Node version, so they
  # run once instead of once per matrix cell.
  static:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Check build output
        run: |
          if [ ! -f "dist/index.js" ] || [ ! -f "dist/index.cjs" ] || [ ! -f "dist/index.d.ts" ]; then
            echo "Build output is incomplete"
            exit 1
          fi
          echo "Build output verified successfully"

  # Node's supported release lines move on a published schedule, so they are
  # resolved at run time for the same reason the Electron matrix is.
  node-versions:
    name: Resolve Node versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Resolve supported releases
        id: resolve
        run: |
          node --input-type=module -e '
            // Everything at or above the declared engines floor. Older lines
            // are out of support for this package, not just for Node.
            const FLOOR = 22;
            const FALLBACK = ["22.x", "24.x", "26.x"];

            let versions;
            try {
              const response = await fetch(
                "https://raw.githubusercontent.com/nodejs/Release/main/schedule.json",
                { signal: AbortSignal.timeout(30_000) }
              );
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }
              const schedule = await response.json();
              const today = new Date().toISOString().slice(0, 10);

              versions = Object.entries(schedule)
                .filter(
                  ([name, line]) =>
                    line.start <= today &&
                    today < line.end &&
                    Number(name.slice(1)) >= FLOOR
                )
                .map(([name]) => Number(name.slice(1)))
                .sort((left, right) => left - right)
                .map((major) => major + ".x");

              if (versions.length === 0) {
                throw new Error("no supported releases at or above " + FLOOR);
              }
            } catch (error) {
              console.error("Falling back to a pinned list:", error.message);
              versions = FALLBACK;
            }

            console.log(JSON.stringify(versions, null, 2));
            await import("node:fs").then(({ appendFileSync }) =>
              appendFileSync(
                process.env.GITHUB_OUTPUT,
                "matrix=" + JSON.stringify(versions) + "\n"
              )
            );
          '

  test:
    name: Node.js ${{ matrix.node-version }}
    needs: node-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(needs.node-versions.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-electron
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test
        shell: bash
        run: $ELECTRON_LAUNCH_PREFIX pnpm test
