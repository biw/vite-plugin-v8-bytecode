name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Electron ships patches weekly and a new major roughly every eight weeks,
  # and each one carries a different V8. Without a timer, a break in a newly
  # released Electron stays invisible until someone happens to open a PR.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  validate:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
          - 26.x

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Electron sandbox
        run: |
          node -e 'require("electron")'
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Check build output
        run: |
          if [ ! -f "dist/index.js" ] || [ ! -f "dist/index.cjs" ] || [ ! -f "dist/index.d.ts" ]; then
            echo "Build output is incomplete"
            exit 1
          fi
          echo "Build output verified successfully"

      - name: Test
        run: xvfb-run --auto-servernum pnpm test

  # Electron supports only its latest three stable majors, and that window
  # slides every few weeks. Resolving it at run time means the schedule above
  # picks up each new major on its own instead of testing whatever list was
  # hardcoded when this file was last touched.
  electron-versions:
    name: Resolve Electron versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Resolve supported majors
        id: resolve
        run: |
          node --input-type=module -e '
            const FALLBACK = [
              { version: "43", experimental: false },
              { version: "42", experimental: false },
              { version: "41", experimental: false },
            ];

            let entries;
            try {
              const response = await fetch(
                "https://releases.electronjs.org/releases.json",
                { signal: AbortSignal.timeout(30_000) }
              );
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }
              const releases = await response.json();
              const isPrerelease = (version) =>
                /-(alpha|beta|nightly)/.test(version);
              const majors = [
                ...new Set(
                  releases
                    .filter((release) => !isPrerelease(release.version))
                    .map((release) => Number(release.version.split(".")[0]))
                ),
              ].sort((left, right) => right - left);

              entries = majors.slice(0, 3).map((major) => ({
                version: String(major),
                experimental: false,
              }));

              // Alphas and betas are Electron previews, so a failure there is
              // information rather than a defect in this repository. Marked
              // experimental so it reports without blocking a merge.
              const preview = releases.find((release) =>
                /-(alpha|beta)/.test(release.version)
              );
              if (preview) {
                entries.push({ version: preview.version, experimental: true });
              }
            } catch (error) {
              console.error("Falling back to a pinned list:", error.message);
              entries = FALLBACK;
            }

            console.log(JSON.stringify(entries, null, 2));
            await import("node:fs").then(({ appendFileSync }) =>
              appendFileSync(
                process.env.GITHUB_OUTPUT,
                "matrix=" + JSON.stringify(entries) + "\n"
              )
            );
          '

  electron:
    name: Electron ${{ matrix.version }}
    needs: electron-versions
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.electron-versions.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pin Electron ${{ matrix.version }}
        run: pnpm add --save-dev electron@${{ matrix.version }}

      - name: Configure Electron sandbox
        run: |
          node -e 'require("electron")'
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      # Must follow the sandbox step: the first `require("electron")` downloads
      # the binary and logs to stdout, which would otherwise be captured as
      # part of the executable path below.
      - name: Report runtime versions
        run: |
          ELECTRON_RUN_AS_NODE=1 "$(node -p 'require("electron")' | tail -1)" -p \
            'JSON.stringify(process.versions, null, 2)'

      - name: Test Electron runtime
        run: |
          xvfb-run --auto-servernum pnpm exec vitest run \
            test/electron-asar.test.ts \
            test/electron-comparison.test.ts \
            test/electron-runtime.test.ts
