name: Setup Electron test environment
description: >-
  Installs dependencies, optionally pins an Electron version, and prepares the
  sandbox and virtual display an Electron main process needs on Linux. Shared
  by every workflow so the setup cannot drift between them.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: 24.x
  electron-version:
    description: >-
      Electron version to install over the lockfile entry. Leave empty to test
      the version the lockfile already pins.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        cache: true

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Pin Electron ${{ inputs.electron-version }}
      if: inputs.electron-version != ''
      shell: bash
      run: pnpm add --save-dev electron@${{ inputs.electron-version }}

    # The first require("electron") downloads the binary, so this also warms
    # that download before anything tries to resolve the executable path.
    - name: Configure Electron sandbox
      shell: bash
      run: |
        node -e 'require("electron")'
        sudo chown root:root node_modules/electron/dist/chrome-sandbox
        sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

    - name: Install virtual display
      shell: bash
      run: sudo apt-get update && sudo apt-get install --yes xvfb

    # Reported from a real main process. Node mode initializes V8 differently
    # from the runtime the plugin targets, so it is never used here.
    - name: Report runtime versions
      shell: bash
      run: |
        probe="$(mktemp -d)"
        cat > "$probe/main.cjs" <<'PROBE'
        const { app } = require("electron");
        console.log(JSON.stringify(process.versions, null, 2));
        app.exit(0);
        PROBE
        echo '{"main":"main.cjs","name":"probe","private":true}' > "$probe/package.json"
        xvfb-run --auto-servernum "$(node -p 'require("electron")' | tail -1)" \
          --user-data-dir="$probe/user-data" "$probe"
